# Entorno para GitHub Codespaces o Dev Containers de VS Code.
# La app comparte la red del contenedor de PostgreSQL, así que la base está en localhost:5432.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:u4local@localhost:5432/tienda

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: u4local
      POSTGRES_DB: tienda
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
